# Offline default CI: no secrets, no model/provider calls, no paid evaluation.
# Temporary files, caches, venvs and build output go to $RUNNER_TEMP/policyops,
# outside the checkout; Python bytecode is disabled. Nothing is uploaded.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Publication guard and gitleaks history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route temporary files outside the checkout
        shell: bash
        run: |
          root="$RUNNER_TEMP/policyops"
          mkdir -p "$root/tmp"
          {
            echo "POLICYOPS_TEMP_DIR=$root"
            echo "TEMP=$root/tmp"
            echo "TMP=$root/tmp"
            echo "TMPDIR=$root/tmp"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - name: Publication guard (index and all history)
        run: |
          python3 -B scripts/check_publication.py
          python3 -B scripts/check_publication.py --history
      - name: Install checksum-verified gitleaks 8.30.1
        run: python3 -B scripts/gitleaks_gate.py install
      - name: gitleaks over all fetched history
        run: python3 -B scripts/gitleaks_gate.py history

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: python3
            uv-checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          - os: windows-2025
            py: python
            uv-checksum: 0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Route temporary files outside the checkout
        run: |
          root="$RUNNER_TEMP/policyops"
          mkdir -p "$root/tmp"
          {
            echo "POLICYOPS_TEMP_DIR=$root"
            echo "TEMP=$root/tmp"
            echo "TMP=$root/tmp"
            echo "TMPDIR=$root/tmp"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      # The operator-client host unit tests import its pure functions through node_executable(), which needs the
      # pinned Node from .nvmrc; no npm install is required for them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
      - name: Install checksum-verified gitleaks 8.30.1 (hook tests use it)
        run: ${{ matrix.py }} -B scripts/gitleaks_gate.py install
      - name: Provision the pinned cl100k_base vocabulary (hash-checked; the tests never download)
        run: ${{ matrix.py }} -B scripts/fetch_tokenizer_vocab.py
      - name: Application environment (frozen lock)
        run: ${{ matrix.py }} -B scripts/devenv.py uv sync --frozen
      - name: Lint
        run: ${{ matrix.py }} -B scripts/devenv.py uv run --frozen ruff check .
      - name: Type check
        run: ${{ matrix.py }} -B scripts/devenv.py uv run --frozen mypy
      - name: Tests
        run: ${{ matrix.py }} -B scripts/devenv.py uv run --frozen pytest
      - name: Evaluator environment (separate frozen lock)
        run: ${{ matrix.py }} -B scripts/devenv.py uv sync --project evals --frozen
      - name: Evaluator type check and tests
        working-directory: evals
        run: |
          ${{ matrix.py }} -B ../scripts/devenv.py uv run --frozen mypy
          ${{ matrix.py }} -B ../scripts/devenv.py uv run --frozen pytest
      - name: No artifacts left in the checkout
        run: ${{ matrix.py }} -B scripts/check_repo_artifacts.py

  postgres:
    # Linux only: GitHub's Windows runners have no Linux container engine. The fixture starts its own labelled,
    # read-only container on an ephemeral 127.0.0.1 port, binds all writable data under $RUNNER_TEMP/policyops
    # and removes the container by ID; this job then checks that no owned container or new volume remains.
    name: PostgreSQL and Dex integration (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # A bounded allowance for the application suite plus the evaluator's environment and PostgreSQL cases (the
    # local full application PostgreSQL run took about 23 minutes on Windows; this job has not been run).
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Route temporary files outside the checkout
        run: |
          root="$RUNNER_TEMP/policyops"
          mkdir -p "$root/tmp"
          {
            echo "POLICYOPS_TEMP_DIR=$root"
            echo "TEMP=$root/tmp"
            echo "TMP=$root/tmp"
            echo "TMPDIR=$root/tmp"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: Pull the pinned PostgreSQL and Dex images by digest
        run: |
          for name in postgres oidc; do
            image="$(python3 -B -c 'import json, sys; p = json.load(open("infra/images.json"))["images"][sys.argv[1]]; print(p["image"] + "@" + p["digest"])' "$name")"
            docker pull "$image"
          done
          docker volume ls -q | sort > "$POLICYOPS_TEMP_DIR/volumes-before.txt"
      - name: Application environment (frozen lock)
        run: python3 -B scripts/devenv.py uv sync --frozen
      # The case API contract test type-checks real response bodies with the web app's own TypeScript.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Web toolchain (frozen lock)
        working-directory: apps/web
        run: python3 -B ../../scripts/devenv.py npm ci
      - name: Record the installed web dependency tree (nothing else may exist)
        run: >-
          python3 -B scripts/check_repo_artifacts.py
          --write-baseline "$POLICYOPS_TEMP_DIR/reports/web-installed.txt" --installed apps/web/node_modules
      - name: Provision the pinned cl100k_base vocabulary (hash-checked; the tests never download)
        run: python3 -B scripts/fetch_tokenizer_vocab.py
      - name: PostgreSQL integration tests
        run: python3 -B scripts/devenv.py uv run --frozen pytest -m postgres
      - name: Evaluator environment (separate frozen lock)
        run: python3 -B scripts/devenv.py uv sync --project evals --frozen
      - name: Evaluator PostgreSQL integration tests (retail simulator database)
        working-directory: evals
        run: python3 -B ../scripts/devenv.py uv run --frozen pytest -m postgres
      - name: No owned container or new volume remains
        if: always()
        run: |
          left="$(docker ps -aq --filter label=policyops.owner=policyops-tests)"
          docker volume ls -q | sort > "$POLICYOPS_TEMP_DIR/volumes-after.txt"
          test -z "$left" || { echo "owned containers left: $left"; exit 1; }
          diff "$POLICYOPS_TEMP_DIR/volumes-before.txt" "$POLICYOPS_TEMP_DIR/volumes-after.txt"
      - name: No artifacts left in the checkout (including new files under node_modules)
        run: python3 -B scripts/check_repo_artifacts.py --baseline "$POLICYOPS_TEMP_DIR/reports/web-installed.txt"

  web:
    name: Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: python3
          - os: windows-2025
            py: python
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Route temporary files outside the checkout
        run: |
          root="$RUNNER_TEMP/policyops"
          mkdir -p "$root/tmp"
          {
            echo "POLICYOPS_TEMP_DIR=$root"
            echo "TEMP=$root/tmp"
            echo "TMP=$root/tmp"
            echo "TMPDIR=$root/tmp"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (frozen lock)
        run: ${{ matrix.py }} -B ../../scripts/devenv.py npm ci
      - name: Record the installed dependency tree (nothing else may exist)
        working-directory: .
        run: >-
          ${{ matrix.py }} -B scripts/check_repo_artifacts.py
          --write-baseline "$POLICYOPS_TEMP_DIR/reports/web-installed.txt" --installed apps/web/node_modules
      - name: Lint, type check, test, build
        run: |
          ${{ matrix.py }} -B ../../scripts/devenv.py npm run lint
          ${{ matrix.py }} -B ../../scripts/devenv.py npm run typecheck
          ${{ matrix.py }} -B ../../scripts/devenv.py npm test
          ${{ matrix.py }} -B ../../scripts/devenv.py npm run build
      - name: Generated API types match the committed OpenAPI document (isolated, exactly locked generator)
        run: ${{ matrix.py }} -B ../../scripts/devenv.py ${{ matrix.py }} -B ../../scripts/api_types.py --check
      - name: Vitest user data stays under the temporary root
        working-directory: .
        run: ${{ matrix.py }} -B -m unittest discover -s tests/web -v
      - name: No artifacts left in the checkout (including new files under node_modules)
        working-directory: .
        run: ${{ matrix.py }} -B scripts/check_repo_artifacts.py --baseline "$POLICYOPS_TEMP_DIR/reports/web-installed.txt"
