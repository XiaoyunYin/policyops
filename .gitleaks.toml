# Independent secret scanner configuration for the pinned gitleaks 8.30.1.
# Extends the built-in rules. Tests generate synthetic secrets at run time
# instead of committing fixtures. The only allowlists are the two reviewed
# exceptions below, each limited to one built-in rule, exact values and paths (AND).
title = "PolicyOps gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "policyops-secret-assignment"
description = "Non-empty PolicyOps secret, token, password or key assignment"
regex = '''(?i)\bPOLICYOPS_[A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|API_KEY)\b["']?[ \t]*[:=][ \t]*["']?([^\s"'#]{12,})'''
secretGroup = 1
entropy = 3.0
keywords = ["policyops_"]

# Reviewed false positive (T12): the public ingestion corpus identifiers are
# `corpus_key` values, which generic-api-key reads as a key assignment. Only
# these exact two secrets, only for that rule, only in these two files.
[[allowlists]]
description = "T12 public corpus_key identifiers in the ingestion manifest builder and its committed manifest"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''\Atau2-banking-knowledge\z''', '''\Atau2-retail-policy\z''']
paths = ['''\Aevals/src/policyops_evals/ingest_manifest\.py\z''', '''\Aevals/manifests/tau2-19f13ea3/ingest-corpora\.json\z''']

# Reviewed false positive (G0.4b): QA study configs pin the public
# cross-encoder/ms-marco-MiniLM-L6-v2 tokenizer by `tokenizer_sha256`, which
# generic-api-key reads as a token assignment. The value is the SHA-256 of that
# public tokenizer.json. Only this exact value, only for that rule, only in the
# committed G1 QA study configs.
[[allowlists]]
description = "G0.4b public MiniLM cross-encoder tokenizer digest in committed G1 QA study configs"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''\Ad241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66\z''']
paths = ['''\Aevals/qa_studies/g1-[a-z0-9-]+\.json\z''']
