apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    access: proxy
    editable: false
