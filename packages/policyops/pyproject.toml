[project]
name = "policyops"
version = "0.1.0"
description = "PolicyOps application: API, worker, orchestration and domain services."
requires-python = ">=3.12,<3.13"
dependencies = [
    "policyops-contracts",
    "alembic>=1.18,<2",
    # T11 provider adapters: official SDKs, pinned exactly (implicit retries/timeouts/redirects are disabled in code).
    "anthropic==2.3.0",
    "fastapi>=0.160,<0.170",
    "httpx>=0.28,<0.29",
    # T11 local validation of structured results and tool arguments (bounded local refs only).
    "jsonschema==4.26.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "openai==3.40.0",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn>=0.40,<0.60",
]

[tool.uv.sources]
policyops-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
