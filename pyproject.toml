# Application workspace (locked by uv.lock). The evaluator is a separate uv
# project under evals/ with its own lock; it is intentionally not a member here.
[tool.uv.workspace]
members = ["packages/policyops", "packages/policyops_contracts"]

[tool.uv]
required-version = ">=0.13.6,<0.14"
# Supply-chain cooldown: resolve only distributions published before this
# instant. Move it forward deliberately when updating the lock.
exclude-newer = "2026-10-28T00:00:00Z"

[tool.uv.sources]
policyops = { workspace = true }
policyops-contracts = { workspace = true }

[dependency-groups]
dev = [
    "policyops",
    "policyops-contracts",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PTH", "RUF", "SIM"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
known-first-party = ["policyops", "policyops_contracts", "policyops_evals", "policyops_testing"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = [
    "packages/policyops/src",
    "packages/policyops_contracts/src",
    "scripts",
    "tests",
]
explicit_package_bases = true
mypy_path = ["packages/policyops/src", "packages/policyops_contracts/src", "tests/support"]

[[tool.mypy.overrides]]
# jsonschema ships no type information (T11 uses it only behind policyops.providers.schema).
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
# tests/support holds the shared harness plugin (policyops_testing); `postgres` tests need Docker and run only when
# selected explicitly: pytest -m postgres.
pythonpath = ["tests/support"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-p", "no:cacheprovider",
           "-m", "not postgres"]
xfail_strict = true
filterwarnings = ["error"]
